name: "staging-1124 wsl (ubuntu under windows)"
on:
  push:
    branches: ["pr-1124-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  wsl:
    # WSL is not a GitHub-hosted runner OS. The only honest way to test it is a real WSL
    # distribution inside a windows-latest runner: Linux userland, Windows kernel/filesystem
    # underneath, which is exactly the combination this module could behave differently on.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          update: 'false'
          additional-packages: python3 python3-pip python3-venv git

      - name: python + deps inside WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          python3 -V
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q -e . pytest pytest-asyncio pytest-timeout

      - name: run the fallback suite inside WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          . /tmp/venv/bin/activate
          rc=0
          python -m pytest tests/test_hf_xet_fallback.py -q --tb=short > pytest_out.txt 2>&1 || rc=$?
          cat pytest_out.txt
          if [ "$rc" = "5" ]; then echo "no tests ran (deps absent)"; rc=0; fi
          if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Please install Unsloth" pytest_out.txt \
             && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then
            echo "collection needs a dep this runner does not ship"; rc=0
          fi
          if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then
            tot=$(grep -cE "^FAILED " pytest_out.txt || true)
            dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).|Please install Unsloth$" pytest_out.txt || true)
            if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then
              echo "only tests needing an absent dep failed"; rc=0
            fi
          fi
          exit "$rc"

      - name: cross-filesystem check on DrvFs (/mnt/c)
        shell: wsl-bash {0}
        run: |
          set -eu
          . /tmp/venv/bin/activate
          # The one thing WSL genuinely changes for this module: an HF cache on the Windows
          # drive is DrvFs, which reports no sparse allocation and coarse mtimes, so the
          # progress sensor and the mtime grace behave differently than on ext4.
          mkdir -p /mnt/c/hfcache
          HF_HOME=/mnt/c/hfcache python -m pytest tests/test_hf_xet_fallback.py -q --tb=short
