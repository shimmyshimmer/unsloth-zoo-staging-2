name: "staging-1189 mlx apple silicon"

on:
  push:
    branches: ["pr-1189-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mlx:
    name: "PR 1189 on Apple Silicon"
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      UNSLOTH_COMPILE_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the supported MLX pins
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install pytest==9.0.3 timm
          python -m pip list | grep -iE "^(mlx|mlx-lm|mlx-vlm|transformers|torch) " || true

      - name: Metal probe (hard gate)
        run: python ci_mlx/metal_probe.py

      - name: The PR's own tests
        run: |
          set -o pipefail
          python -m pytest tests/test_mlx_moe_metal.py tests/test_mlx_generate.py \
            -v -rs 2>&1 | tee pytest_head.txt

      - name: Fail if nothing actually ran
        run: python ci_mlx/assert_ran.py pytest_head.txt 20

      - name: Dense control (nothing should fuse)
        run: |
          python ci_mlx/small_models_1189.py --model mlx-community/Qwen3-0.6B-4bit \
            --revision 73e3e38d981303bc594367cd910ea6eb48349da8

      - name: Free the dense control before the MoE download
        run: rm -rf "$HF_HOME"

      - name: Real quantized MoE end to end
        run: |
          df -h / | tail -1
          python ci_mlx/small_models_1189.py --model mlx-community/OLMoE-1B-7B-0125-4bit \
            --revision 23511b9407e0d69bebdcb091ef5353a59f464a99 --expect-moe
