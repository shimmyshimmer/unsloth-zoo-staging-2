name: "macsmoke-1026 real small models (Apple Silicon)"
on:
  push:
    branches: ["pr-1026-macsmoke-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  smoke:
    name: real small models on macos-14
    runs-on: macos-14
    timeout-minutes: 60
    env:
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      HF_HOME: ${{ github.workspace }}/.hfcache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report runner resources
        run: |
          sysctl -n machdep.cpu.brand_string || true
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          df -h .
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "torch>=2.4,<2.11" torchvision "mlx>=0.22.0" "mlx-lm>=0.31.2" pillow
          pip install --upgrade "mlx-vlm==0.6.10" "transformers>=5.14"
      - name: Versions
        run: |
          python -c "import mlx.core as mx; print('mlx', mx.__file__, mx.default_device())"
          python -c "import mlx_vlm, transformers, torch; print('mlx-vlm', mlx_vlm.__version__, 'tf', transformers.__version__, 'torch', torch.__version__)"
      - name: Real small-model MLX smoke
        run: python scripts/mac_mlx_smoke.py 2>&1 | tee macsmoke.log
      - name: Disk after
        if: always()
        run: df -h .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macsmoke-1026
          path: macsmoke.log
