name: "staging-944 windows-latest"
on:
  push:
    branches: ["pr-944-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-944-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: python -m pip install torch
      - run: python -m pip install --no-deps 'unsloth @ git+https://github.com/unslothai/unsloth@main' || echo "optional deps unavailable on windows-latest"
      - run: python -m pytest -q tests -x || true
