name: mlx-pr785
on:
  push:
    branches: ["mlx-pr785-validate"]
  workflow_dispatch:
concurrency:
  group: mlx-pr785-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mlx:
    name: MLX PR 785 Gemma3 language MLP fp32 (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install zoo with MLX extras
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install "pytest==9.0.3"
      - name: Import smoke
        continue-on-error: true
        run: |
          python -c "import unsloth_zoo.mlx.loader; print('loader OK')"
      - name: Gemma3 language MLP patch-target probe (real mlx_vlm)
        run: |
          python - <<'PY'
          import importlib
          from unsloth_zoo.mlx.loader import _fix_gemma3_language_mlp_fp32_activation
          lang = importlib.import_module("mlx_vlm.models.gemma3.language")
          assert hasattr(lang, "MLP"), "gemma3 language MLP target missing in installed mlx_vlm"
          ok = _fix_gemma3_language_mlp_fp32_activation()
          assert ok is True, f"patch did not apply (returned {ok!r})"
          assert getattr(lang.MLP, "_unsloth_fp32_activation_patched", False) is True
          # idempotency
          assert _fix_gemma3_language_mlp_fp32_activation() is True
          print("PR785 gemma3 language MLP fp32 patch applies cleanly on installed mlx_vlm")
          PY
      # Only real-Metal suites here: test_mlx_trainer_internals calls
      # simulate_mlx_on_torch() (torch-backed sys.modules stubs) and is validated
      # on the Linux simulation harness instead, to avoid polluting real-mlx loads.
      - name: Metal e2e regression (real Apple Silicon)
        run: python -m pytest tests/test_mlx_training_e2e_metal.py -v -rs
