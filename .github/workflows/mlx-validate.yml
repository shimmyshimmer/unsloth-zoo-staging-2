name: mlx-pr787
on:
  push:
    branches: ["mlx-pr787-validate"]
  workflow_dispatch:
concurrency:
  group: mlx-pr787-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mlx:
    name: MLX PR 787 Qwen3-VL vision MLP fp16 guard (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install zoo with MLX extras
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install "pytest==9.0.3"
      - name: Compile module + fp16 guard probe (real mlx)
        run: |
          python - <<'PY'
          import inspect
          import unsloth_zoo.mlx.compile as mc
          src = inspect.getsource(mc._install_qwen3_family_compile_patches)
          assert "if residual_dtype == mx.float16:" in src, "fp16 guard missing"
          assert "self.mlp(mlp_norm_out.astype(mx.float32))" in src, "fp16 upcast path missing"
          assert "self.mlp(mlp_norm_out)" in src, "non-fp16 path missing"
          print("PR787 compile imports on real mlx and fp16 guard is present")
          PY
      - name: Source-guard test + metal e2e regression
        run: python -m pytest tests/test_mlx_trainer_internals.py tests/test_mlx_training_e2e_metal.py -v -rs
