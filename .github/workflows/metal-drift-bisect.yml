# Staging-only experiment, not for the upstream repo.
#
# Two identical uncached Gemma 4 E2B forwards disagree on Apple Silicon and are
# bit-exact on Linux CPU. This localizes the disagreement to a decoder layer,
# which is the only thing that separates "the KV-shared layers cause it" from
# "the KV-shared layers are downstream of it". Gemma 4 E2B has 35 layers with
# the last 20 KV-shared, so the boundary to compare against is 15.
#
# Deliberately lean: one job, one mlx-vlm, no checkpoint matrix, and no zoo
# import, so it occupies a macOS runner for as little time as the question
# allows.

name: Metal drift bisect (Apple Silicon)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bisect:
    name: "where does the drift start"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'drift-bisect'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install mlx-vlm only
        # No zoo, no torch: a finding here is reportable upstream without a
        # zoo-shaped caveat, and the install is a fraction of the full one.
        run: |
          python -m pip install --upgrade pip
          pip install "mlx-vlm==0.6.3" "transformers==5.5.0"
          python -c "import mlx.core as mx, mlx_vlm; print('mlx', mx.__version__, 'mlx-vlm', mlx_vlm.__version__)"

      - name: Gemma 4 E2B, the model that drifts
        run: |
          python tests/mlx_layerwise_drift.py \
            --model mlx-community/gemma-4-e2b-it-4bit --rounds 3

      - name: Gemma 3n E2B control
        # Shares K/V too, but only when cached, so an uncached forward never
        # takes that path. Included to show the control is a null result
        # rather than letting it be read as a counterexample.
        if: always()
        run: |
          python tests/mlx_layerwise_drift.py \
            --model mlx-community/gemma-3n-E2B-it-4bit --rounds 3

      - name: Which op is not reproducible?
        # The bisect put the first difference at decoder layer 0, upstream of
        # every KV-shared layer and far too large to be float
        # non-associativity. This walks from the layer down to the op, ending
        # at bare mx.quantized_matmul against an unquantized control, so the
        # finding can be filed with neither mlx-vlm nor unsloth in it.
        if: always()
        run: |
          python tests/mlx_op_drift.py \
            --model mlx-community/gemma-4-e2b-it-4bit --rounds 4
