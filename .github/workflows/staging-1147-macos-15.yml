name: "staging-1147 macos-15"
on:
  push:
    branches: ["pr-1147-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout && { python -m pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth" || echo "unsloth unavailable; zoo import guard may fire"; }
      - run: python -m pip install 'torch>=2.4.0,<2.11.0'
      - run: python -m pip install mlx mlx-cpu 'mlx-lm>=0.31.2' 'mlx-vlm>=0.4.4' timm || echo "optional deps unavailable on macos-15"
      - run: worst=0; for f in tests/test_mlx_distributed_loader.py tests/test_mlx_text_path_contract.py tests/test_mlx_vlm_label_masks.py; do rc=0; echo "::group::$f"; python -m pytest "$f" -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; echo "::endgroup::"; if [ "$rc" != "0" ]; then echo "FAILED FILE $f rc=$rc"; worst="$rc"; fi; done; exit "$worst"
