name: "staging-1124 untouched subsystems (mlx + full suite)"
on:
  push:
    branches: ["pr-1124-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # The PR touches one module. These jobs exercise the parts it does NOT touch, so a
  # regression outside the download ladder cannot hide behind a green targeted suite.
  mlx-apple-silicon:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - name: install mlx (Apple Silicon only)
        run: python -m pip install mlx mlx-lm || echo "mlx unavailable; the import-smoke below still runs"
      - name: torch (CPU wheel) so the mlx suites can collect
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch || echo "no cpu torch wheel for this runner"
      - name: mlx suites
        run: |
          rc=0
          python -m pytest tests/ -q --tb=short -k "mlx or MLX" > out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$rc" = "5" ]; then echo "no mlx tests selected on this runner"; rc=0; fi
          exit "$rc"
      - name: import smoke
        run: python -c "import unsloth_zoo; import unsloth_zoo.hf_xet_fallback as m; print(m.__name__, 'ok')"

  full-suite-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - name: torch (CPU wheel) so the whole-repo suite can actually collect
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: whole repo test suite, not just the changed module
        run: |
          rc=0
          python -m pytest tests/ -q --tb=short -p no:randomly > out.txt 2>&1 || rc=$?
          tail -60 out.txt
          if [ "$rc" = "5" ]; then rc=0; fi
          exit "$rc"
