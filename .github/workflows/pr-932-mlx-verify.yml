      - name: "932 bf912442: full-module-only CPT reload + mixed all-linear expansion"
        if: always()
        run: |
          python - <<'PY'
          import json, os, tempfile
          import mlx.core as mx
          from mlx.utils import tree_flatten
          from transformers import AutoTokenizer, LlamaConfig, LlamaForCausalLM
          from unsloth_zoo.mlx.loader import FastMLXModel
          from unsloth_zoo.mlx.utils import save_trainable_adapters

          print("device", mx.default_device())

          def trainable(m):
              return {n for n, _ in tree_flatten(m.trainable_parameters())}

          def allparams(m):
              return {n for n, _ in tree_flatten(m.parameters())}

          root = tempfile.mkdtemp()
          base = os.path.join(root, "base")
          cfg = LlamaConfig(
              hidden_size=64, intermediate_size=128, num_hidden_layers=2,
              num_attention_heads=4, num_key_value_heads=2, vocab_size=32000,
              max_position_embeddings=128, tie_word_embeddings=False,
          )
          LlamaForCausalLM(cfg).save_pretrained(base, safe_serialization=True)
          AutoTokenizer.from_pretrained(
              "hf-internal-testing/llama-tokenizer"
          ).save_pretrained(base)

          # ---- Probe C: embed_tokens-only CPT reload must not unfreeze the base ----
          m3, _ = FastMLXModel.from_pretrained(
              base, load_in_4bit=False, max_seq_length=64,
          )
          m3 = FastMLXModel.get_peft_model(
              m3, r=8, lora_alpha=16, target_modules=["embed_tokens"],
          )
          tr3, all3 = trainable(m3), allparams(m3)
          print("PROBE-C at save: trainable", len(tr3), "of", len(all3), sorted(tr3))
          assert tr3 == {"model.embed_tokens.weight"}, sorted(tr3)
          cdir = os.path.join(root, "cpt_embed_only")
          save_trainable_adapters(m3, cdir)
          with open(os.path.join(cdir, "adapter_config.json")) as fh:
              ccfg = json.load(fh)
          print("PROBE-C artifact fine_tune_type", ccfg.get("fine_tune_type"),
                "lora_module_paths", ccfg.get("unsloth_mlx_lora_module_paths"))
          assert ccfg.get("fine_tune_type") == "full", ccfg.get("fine_tune_type")
          assert not ccfg.get("unsloth_mlx_lora_module_paths"), ccfg
          r3, _ = FastMLXModel.from_pretrained(
              cdir, load_in_4bit=False, max_seq_length=64,
          )
          tr3r, all3r = trainable(r3), allparams(r3)
          keys3 = set(getattr(r3, "_unsloth_cpt_full_module_weight_keys", set()))
          print("PROBE-C after reload: trainable", len(tr3r), "of", len(all3r),
                "cpt-lr-keys", sorted(keys3))
          assert tr3r == {"model.embed_tokens.weight"}, (
              "base UNFROZE on pathless reload: " + repr(sorted(tr3r)[:12]))
          assert keys3 == {"model.embed_tokens.weight"}, sorted(keys3)
          print("PROBE-C OK: embed-only CPT artifact reloads", len(tr3r), "/",
                len(all3r), "trainable with the CPT LR keys intact")

          # ---- Probe C2: modules_to_save=["lm_head"] only, same pathless route ----
          h, _ = FastMLXModel.from_pretrained(
              base, load_in_4bit=False, max_seq_length=64,
          )
          h = FastMLXModel.get_peft_model(
              h, r=8, lora_alpha=16, target_modules=[],
              modules_to_save=["lm_head"],
          )
          trh = trainable(h)
          print("PROBE-C2 at save: trainable", len(trh), sorted(trh))
          assert trh == {"lm_head.weight"}, sorted(trh)
          hdir = os.path.join(root, "cpt_head_only")
          save_trainable_adapters(h, hdir)
          hr, _ = FastMLXModel.from_pretrained(
              hdir, load_in_4bit=False, max_seq_length=64,
          )
          trhr = trainable(hr)
          keysh = set(getattr(hr, "_unsloth_cpt_full_module_weight_keys", set()))
          print("PROBE-C2 after reload: trainable", len(trhr), "of",
                len(allparams(hr)), "cpt-lr-keys", sorted(keysh))
          assert trhr == {"lm_head.weight"}, (
              "base UNFROZE on head-only pathless reload: "
              + repr(sorted(trhr)[:12]))
          assert keysh == {"lm_head.weight"}, sorted(keysh)
          print("PROBE-C2 OK: head-only CPT artifact reloads without "
                "unfreezing the base")

          # ---- Probe D: ["all-linear", "embed_tokens"] must attach REAL LoRA ----
          d, _ = FastMLXModel.from_pretrained(
              base, load_in_4bit=False, max_seq_length=64,
          )
          d = FastMLXModel.get_peft_model(
              d, r=8, lora_alpha=16,
              target_modules=["all-linear", "embed_tokens"],
          )
          trd = trainable(d)
          lora = sorted(k for k in trd if ".lora_a" in k)
          print("PROBE-D trainable", len(trd), "lora_a tensors", len(lora))
          assert "model.embed_tokens.weight" in trd, sorted(trd)[:12]
          for leaf in ("q_proj", "k_proj", "v_proj", "o_proj",
                       "gate_proj", "up_proj", "down_proj"):
              assert any(k.endswith(leaf + ".lora_a") for k in trd), (
                  "NO LoRA on " + leaf
                  + " -- all-linear was not expanded inside the mixed list")
          keysd = set(getattr(d, "_unsloth_cpt_full_module_weight_keys", set()))
          assert keysd == {"model.embed_tokens.weight"}, sorted(keysd)
          print("PROBE-D OK: all-linear expanded inside a mixed CPT list;",
                len(lora), "LoRA modules attached alongside the embedding")
          PY
      - name: "932+939 interaction: CPT full-module tensors trainable after reload"
        if: always()
        run: |
          python - <<'PY'
          import os, tempfile
          import mlx.core as mx
          from mlx.utils import tree_flatten
          from transformers import AutoTokenizer, LlamaConfig, LlamaForCausalLM
          from unsloth_zoo.mlx import loader as _loader
          from unsloth_zoo.mlx.loader import FastMLXModel
          from unsloth_zoo.mlx.utils import (
              collect_mlx_lora_adapter_tensors, save_trainable_adapters,
          )

          print("device", mx.default_device())

          def trainable(m):
              return {n for n, _ in tree_flatten(m.trainable_parameters())}

          root = tempfile.mkdtemp()
          base = os.path.join(root, "base")
          cfg = LlamaConfig(
              hidden_size=64, intermediate_size=128, num_hidden_layers=2,
              num_attention_heads=4, num_key_value_heads=2, vocab_size=32000,
              max_position_embeddings=128, tie_word_embeddings=False,
          )
          LlamaForCausalLM(cfg).save_pretrained(base, safe_serialization=True)
          AutoTokenizer.from_pretrained(
              "hf-internal-testing/llama-tokenizer"
          ).save_pretrained(base)

          # ---- Probe A: CPT-style full modules survive 939's base freeze on reload ----
          model, _ = FastMLXModel.from_pretrained(
              base, load_in_4bit=False, max_seq_length=64,
          )
          model = FastMLXModel.get_peft_model(
              model, r=8, lora_alpha=16, target_modules=["q_proj", "v_proj"],
          )
          mods = dict(model.named_modules())
          cpt = set()
          for path in ("model.embed_tokens", "lm_head"):
              mods[path].unfreeze(recurse=True)
              cpt.update(
                  f"{path}.{n}" for n, _ in tree_flatten(mods[path].parameters())
              )
          assert cpt <= trainable(model), sorted(cpt - trainable(model))
          adir = os.path.join(root, "cpt_adapter")
          save_trainable_adapters(model, adir)
          saved = set(mx.load(os.path.join(adir, "adapters.safetensors")).keys())
          print("PROBE-A cpt tensors", sorted(cpt), "in adapters.safetensors", cpt <= saved)
          assert cpt <= saved, sorted(cpt - saved)
          r, _ = FastMLXModel.from_pretrained(
              adir, load_in_4bit=False, max_seq_length=64,
          )
          tr = trainable(r)
          ak = set(collect_mlx_lora_adapter_tensors(r).keys())
          print("PROBE-A reloaded: trainable", len(tr), "adapter", len(ak),
                "cpt-trainable", cpt <= tr)
          assert cpt <= tr, "CPT tensors LOST on reload: " + repr(sorted(cpt - tr))
          assert ak <= tr, sorted(ak - tr)
          assert tr == ak | cpt, "not a warm start: " + repr(sorted(tr - (ak | cpt)))
          print("PROBE-A OK: CPT full-module tensors come back TRAINABLE after reload")

          # ---- Probe B: 932's scoped-LR key rebuild through 939's reordered reload ----
          if not hasattr(_loader, "_rebuild_cpt_full_module_weight_keys"):
              print("PROBE-B SKIP: 932 is not on this tree "
                    "(no _rebuild_cpt_full_module_weight_keys)")
          else:
              m2, _ = FastMLXModel.from_pretrained(
                  base, load_in_4bit=False, max_seq_length=64,
              )
              m2 = FastMLXModel.get_peft_model(
                  m2, r=8, lora_alpha=16,
                  target_modules=["q_proj", "embed_tokens", "lm_head"],
              )
              keys = set(getattr(m2, "_unsloth_cpt_full_module_weight_keys", set()))
              print("PROBE-B fresh scoped-LR keys", sorted(keys))
              assert "model.embed_tokens.weight" in keys, sorted(keys)
              bdir = os.path.join(root, "cpt932")
              save_trainable_adapters(m2, bdir)
              r2, _ = FastMLXModel.from_pretrained(
                  bdir, load_in_4bit=False, max_seq_length=64,
              )
              tr2 = trainable(r2)
              keys2 = set(getattr(r2, "_unsloth_cpt_full_module_weight_keys", set()))
              print("PROBE-B reloaded scoped-LR keys", sorted(keys2),
                    "embed trainable", "model.embed_tokens.weight" in tr2)
              assert "model.embed_tokens.weight" in tr2, sorted(tr2)
              assert keys == keys2, (sorted(keys), sorted(keys2))
              print("PROBE-B OK: 932 scoped-LR keys rebuilt through 939's reordered reload")
          PY

      - name: "Remaining tests/test_mlx*.py sweep (known red on upstream main, excluded from the pass/fail verdict)"
        if: always()
        continue-on-error: true
        run: |
          strict="tests/test_mlx_cpt_partition_metal.py tests/test_mlx_save_lora_adapters_filter.py tests/test_mlx_training_e2e_metal.py tests/test_mlx_trainer_internals.py tests/test_mlx_switch_lora.py"
          rc=0
          for f in tests/test_mlx*.py; do
            case " $strict " in *" $f "*) echo "SWEEP-SKIP $f (covered by a strict step)"; continue ;; esac
            echo "::group::$f"
            python -m pytest "$f" -q -rs \
              --deselect tests/test_mlx_batching_and_decay.py::test_compiler_review_guards_are_present \
              || { echo "SWEEP-RED $f"; rc=1; }
            echo "::endgroup::"
          done
          echo "SWEEP-EXIT $rc (informational only; the strict steps above are the verdict)"
