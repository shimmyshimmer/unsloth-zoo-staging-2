name: "staging-959 windows-latest"
on:
  push:
    branches: ["pr-959-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-959-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: python -m pip install 'torch>=2.4,<2.11' datasets jinja2 psutil
      - run: python -m pip install --no-deps 'unsloth @ git+https://github.com/unslothai/unsloth@main' || echo "optional deps unavailable on windows-latest"
      - run: rc=0; python -m pytest tests/test_sft_prepare_dataset_double_bos.py tests/test_pr959_xplat_e2e.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
