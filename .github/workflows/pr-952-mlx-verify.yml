      - name: "952 04acb10c/9881849b: Qwen3-VL mixed batch parity + reused prompt cache"
        if: always()
        run: |
          export PROBE_EXPECT_ZOO_ROOT=$GITHUB_WORKSPACE
          python - <<'PY'
          """PR 952 probe: Qwen3-VL mixed text/image batch generation on Apple Silicon.

          Everything this PR fixes about Qwen3's visual window was measured only on MLX's CPU
          backend on Linux. Nobody should claim mixed text/image batches generate correctly on
          Apple Silicon until it runs there, which is what this probe is for.

          It drives a REAL `mlx_vlm.models.qwen3_vl.Model` -- real config, real
          `get_input_embeddings`, real `LanguageModel`, real attention and real deepstack merge.
          Only the vision TOWER is stubbed, because the pixel encoder is not what this PR
          changes and stubbing it makes each row's contribution identifiable by value.

          The path under test is the shipped one, end to end:
              per-request kwargs (mirroring mlx_vlm/server/generation.py::_gpu_embed)
                -> mlx_vlm.generate.ar._merge_prefill_prompt_kwargs   (wrapped by the PR)
                -> qwen3_vl LanguageModel.__call__                    (wrapped by the PR)
                -> Qwen3VLModel._deepstack_process

          METHOD. For every batch shape, each row is also prefilled ALONE, and the batched
          logits for that row are compared against its solo logits. Max absolute deviation per
          row is reported. A correct implementation gives 0.000000 for every row: batching must
          not change what any single row generates.

            PROBE-Q1  mixed [text, visual], equal prompt lengths
            PROBE-Q2  all-visual batch (control: every row carries the key)
            PROBE-Q3  unequal prompt lengths with REAL left padding
            PROBE-Q4  three rows [text, visual, text]
            PROBE-Q5  reused prompt cache -- the deepstack path, the other Metal-sensitive fix
            PROBE-Q6  left-padded rows must not borrow a neighbour's features
            PROBE-Q7  a cache that declares left_padding as None must not crash

          Exit code 0 == every row of every batch matches its solo prefill exactly.

          A/B validated on Linux CPU before staging against the pre-fix bodies of
          _qwen3_visual_window / _qwen3_cache_offsets / _pad_qwen3_prompt_rows (see REPORT_952.md).
          """
          import importlib
          import os
          import sys
          import types

          import mlx.core as mx
          import mlx.nn as nn

          import unsloth_zoo

          print("PROBE-Q unsloth_zoo from", unsloth_zoo.__file__)
          _EXPECT_ROOT = os.environ.get("PROBE_EXPECT_ZOO_ROOT")
          if _EXPECT_ROOT:
              _actual = os.path.realpath(unsloth_zoo.__file__)
              if not _actual.startswith(os.path.realpath(_EXPECT_ROOT) + os.sep):
                  sys.exit(
                      f"PROBE-Q FAIL: imported unsloth_zoo from {_actual}, "
                      f"expected it under {_EXPECT_ROOT}"
                  )

          if "mlx_simulation" in str(getattr(mx, "__file__", "")):
              sys.exit("PROBE-Q FAIL: mlx.core is the simulation stub, not the real runtime")
          print("PROBE-Q device", mx.default_device())
          try:
              print("PROBE-Q metal", mx.metal.is_available())
          except Exception as exc:  # pragma: no cover - platform dependent
              print("PROBE-Q metal <unavailable>", type(exc).__name__)

          import mlx_vlm  # noqa: E402

          print("PROBE-Q mlx_vlm", mlx_vlm.__version__, mlx_vlm.__file__)

          from mlx_vlm.models.qwen3_vl import qwen3_vl as q3  # noqa: E402
          from mlx_vlm.models.qwen3_vl.config import (  # noqa: E402
              ModelConfig,
              TextConfig,
              VisionConfig,
          )
          from mlx_lm.models import cache as mlx_cache  # noqa: E402

          # `import mlx_vlm.generate.ar as ar` fails on some installs because the package-level
          # __getattr__ resolves `ar` oddly; importlib is what the shipped installer uses too.
          ar = importlib.import_module("mlx_vlm.generate.ar")
          if not hasattr(ar, "_merge_prefill_prompt_kwargs"):
              sys.exit("PROBE-Q FAIL: mlx-vlm has no _merge_prefill_prompt_kwargs to exercise")
          if not hasattr(mlx_cache, "BatchKVCache"):
              sys.exit("PROBE-Q FAIL: mlx-lm has no BatchKVCache, the left-padding path is unreachable")

          import unsloth_zoo.mlx.compile as mc  # noqa: E402

          mc._install_qwen3_family_compile_patches()
          merged_fn = getattr(ar, "_merge_prefill_prompt_kwargs")
          print(
              "PROBE-Q patches installed:",
              "prompt_merge_wrapped=", bool(getattr(merged_fn, "_unsloth_qwen3_prompt_merge", False)),
              "language_call_wrapped=",
              bool(
                  getattr(
                      importlib.import_module(
                          "mlx_vlm.models.qwen3_vl.language"
                      ).LanguageModel.__call__,
                      "_unsloth_qwen3_visual_state",
                      False,
                  )
              ),
          )
          if not getattr(merged_fn, "_unsloth_qwen3_prompt_merge", False):
              sys.exit("PROBE-Q FAIL: the prompt-merge adapter is not installed; nothing under test")

          HIDDEN, N_DEEPSTACK = 16, 2
          TOL = 1e-4


          class _StubVisionTower(nn.Module):
              """Real shape contract, values that identify the row they came from."""

              def __init__(self, hidden):
                  super().__init__()
                  self.hidden = hidden
                  self.patch_embed = type(
                      "P", (), {"proj": type("W", (), {"weight": mx.zeros((1,), dtype=mx.float32)})()}
                  )()

              def __call__(self, pixel_values, grid_thw):
                  n = int(pixel_values.shape[0])
                  base = float(pixel_values[0, 0].item())
                  return (
                      mx.full((n, self.hidden), base, dtype=mx.float32),
                      [
                          mx.full((n, self.hidden), base + 100.0 * (i + 1), dtype=mx.float32)
                          for i in range(N_DEEPSTACK)
                      ],
                  )


          def build_model():
              text = TextConfig(
                  model_type="qwen3_vl", num_hidden_layers=2, hidden_size=HIDDEN,
                  intermediate_size=32, num_attention_heads=2, rms_norm_eps=1e-6,
                  vocab_size=200, num_key_value_heads=1, head_dim=8, rope_theta=10000.0,
                  max_position_embeddings=512,
                  rope_scaling={"type": "default", "mrope_section": [2, 1, 1]},
              )
              vision = VisionConfig(
                  depth=2, hidden_size=8, intermediate_size=16, out_hidden_size=HIDDEN,
                  num_heads=2, patch_size=2, spatial_patch_size=2, spatial_merge_size=1,
                  temporal_patch_size=2, deepstack_visual_indexes=[0, 1],
              )
              cfg = ModelConfig(
                  text_config=text, vision_config=vision, model_type="qwen3_vl",
                  image_token_id=5, video_token_id=6, vision_start_token_id=4, vocab_size=200,
              )
              m = q3.Model(cfg)
              m.vision_tower = _StubVisionTower(HIDDEN)
              m.eval()  # mlx_vlm.utils.load() does this; nn.Module.training defaults True
              return m


          def gpu_embed(model, ids, pixel_values=None, **data_kwargs):
              """Faithful copy of mlx_vlm/server/generation.py::_gpu_embed kwargs assembly."""
              embed = model.get_input_embeddings(
                  mx.array([ids], dtype=mx.int32), pixel_values, mask=None, **data_kwargs
              )
              return {**data_kwargs, **{k: v for k, v in embed.to_dict().items() if v is not None}}


          def run(lm, ids_rows, kwargs_list):
              """Prefill one batch through the shipped merge + the patched language call."""
              inputs_embeds, merged = ar._merge_prefill_prompt_kwargs(kwargs_list, ids_rows)
              lengths = [len(r) for r in ids_rows]
              max_len = max(lengths)
              left_padding = [max_len - n for n in lengths]
              padded_ids = [[0] * (max_len - len(r)) + r for r in ids_rows]
              caches = [mlx_cache.BatchKVCache(left_padding=left_padding) for _ in range(2)]
              call_kwargs = dict(merged)
              call_kwargs.pop("inputs_embeds", None)
              call_kwargs.pop("rope_deltas", None)
              out = lm(
                  mx.array(padded_ids, dtype=mx.int32), inputs_embeds=inputs_embeds,
                  mask=None, cache=caches, **call_kwargs,
              )
              logits = out.logits if hasattr(out, "logits") else out
              mx.eval(logits)
              return logits


          mx.random.seed(0)
          model = build_model()
          lm = model.language_model

          VIS = [10, 4, 5, 5, 5, 20]          # vision_start(4) then three image tokens(5)
          VIS2 = [11, 4, 5, 5, 5, 21]
          SHORT_TEXT = [10, 11, 12]           # shorter -> REAL left padding in a mixed batch
          LONG_TEXT = [10, 11, 12, 13, 14, 15]

          PX1 = mx.full((3, 24), 7.0, dtype=mx.float32)
          PX2 = mx.full((3, 24), 9.0, dtype=mx.float32)
          GRID = mx.array([[1, 3, 1]], dtype=mx.int32)

          kw_vis = gpu_embed(model, VIS, pixel_values=PX1, image_grid_thw=GRID)
          kw_vis2 = gpu_embed(model, VIS2, pixel_values=PX2, image_grid_thw=GRID)
          kw_short = gpu_embed(model, SHORT_TEXT)
          kw_long = gpu_embed(model, LONG_TEXT)

          print(
              "PROBE-Q per-row kwargs: text row keys=",
              sorted(kw_long), " visual row keys=", sorted(kw_vis),
          )

          alone_vis = run(lm, [VIS], [kw_vis])
          alone_vis2 = run(lm, [VIS2], [kw_vis2])
          alone_short = run(lm, [SHORT_TEXT], [kw_short])
          alone_long = run(lm, [LONG_TEXT], [kw_long])

          problems = []


          def check(tag, label, ids_rows, kws, refs):
              print(f"\n--- {tag} {label} ---")
              try:
                  out = run(lm, ids_rows, kws)
              except Exception as exc:  # noqa: BLE001
                  print(f"{tag} RAISED {type(exc).__name__}: {exc}")
                  problems.append(f"{tag}: raised {type(exc).__name__}: {exc}")
                  return
              for i, ref in enumerate(refs):
                  n = ref.shape[1]
                  dev = float(mx.abs(out[i : i + 1, -n:, :] - ref).max().item())
                  verdict = "CORRECT" if dev < TOL else "WRONG"
                  print(f"{tag} row{i}: |batched - alone|_max = {dev:.6f} -> {verdict}")
                  if dev >= TOL:
                      problems.append(f"{tag} row{i}: deviation {dev:.6f}")


