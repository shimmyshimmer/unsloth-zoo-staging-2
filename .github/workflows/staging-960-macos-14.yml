# Staging-only workflow for unsloth-zoo PR #960 review.
#
# Upstream CI never exercises response masking on macOS: every marker/masking test
# below is collect-only in consolidated-tests-ci.yml, and mlx-ci.yml is gated behind
# the `mlx` label which #960 does not carry. This job executes them on Apple Silicon.

name: "staging-960 macos-14 (masking)"

on:
  push:
    branches: ["pr-960-xplat-ci"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  masking:
    name: response-masking tests (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install zoo + torch
        # pyproject gates torch OFF on darwin+arm64, but tests/mlx_simulation/__init__.py
        # imports it unconditionally for the torch-spoof shim, so install it explicitly.
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[core]
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
          pip install pytest==9.0.3

      - name: PR regression suite (HARD GATE)
        run: python -m pytest tests/test_find_common_token_ids_no_match.py -v

      - name: Response-masking tests upstream CI only collects
        run: |
          python -m pytest \
            tests/test_train_on_responses_list_labels.py \
            tests/test_zephyr_marker_context.py \
            tests/test_reasoning_marker_strip.py \
            tests/test_mlx_autodetect_template_source.py \
            tests/test_mlx_trainer_internals.py \
            tests/test_mlx_module_exports.py \
            tests/test_mlx_vlm_label_masks.py \
            tests/test_pr684_review_fixes_a.py \
            -v -rs

      - name: Behavioral gates (same list as the Linux hard gate)
        run: |
          python -m pytest \
            tests/test_training_utils_use_cache.py \
            tests/test_mlx_finetune_last_n_layers.py \
            tests/test_mlx_double_quant_reject.py \
            tests/test_get_transformers_model_type_empty.py \
            -v
